name: Export and publish Godot Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.5.1
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
            mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
            curl -L --fail -o /tmp/godot_templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
            cp -f /tmp/godot_templates/templates/web_nothreads_debug.zip "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
            cp -f /tmp/godot_templates/templates/web_nothreads_release.zip "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          mkdir -p build/Web
            godot --headless --path . --editor --quit
            godot --headless --verbose --path . --export-debug Web build/Web/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/Web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
