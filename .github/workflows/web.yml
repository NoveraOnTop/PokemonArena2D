name: Export and publish Godot Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-export-templates: true
      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/Web
            godot --headless --path . --export-release Web build/Web/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/Web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
